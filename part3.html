<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3 - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff0f3; }
        .navbar { background-color: #d87093 !important; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(219, 112, 147, 0.15); }
        .btn-primary { background-color: #db7093; border-color: #db7093; }
        .btn-primary:hover { background-color: #c71585; border-color: #c71585; }
        h3 { color: #c71585; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌸 Assignment #4</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Main</a></li>
                    <li class="nav-item"><a class="nav-link" href="part1.html">part 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="part2.html">part 2</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part3.html">part 3</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card p-4 mx-auto" style="max-width: 750px;">
            <h3 class="mb-3 text-center">Task 4: Registration</h3>
            <p class="text-muted text-center small mb-4">Tell about yourself</p>

            <form class="needs-validation" novalidate>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fName" class="form-label fw-semibold">Name</label>
                        <input type="text" class="form-control" id="fName" required>
                        <div class="invalid-feedback">Namieeee</div>
                    </div>
                    <div class="col-md-6">
                        <label for="lName" class="form-label fw-semibold">Surname</label>
                        <input type="text" class="form-control" id="lName" required>
                        <div class="invalid-feedback">Surnamieee</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="rEmail" class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="rEmail" required>
                    <div class="invalid-feedback">Enter normal email</div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="rPass" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="rPass" minlength="6" required>
                        <div class="invalid-feedback">It should be 6 sign</div>
                    </div>
                    <div class="col-md-6">
                        <label for="rPassConfirm" class="form-label fw-semibold">Repeat me cutiee</label>
                        <input type="password" class="form-control" id="rPassConfirm" required>
                        <div class="invalid-feedback">They should be twins, not sisterrs</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" required>
                        <label class="form-check-label" for="male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" required>
                        <label class="form-check-label" for="female">Female</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Hobby</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hRead" value="reading">
                        <label class="form-check-label" for="hRead">Reading</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hSport" value="sports">
                        <label class="form-check-label" for="hSport">Sport</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hMusic" value="music">
                        <label class="form-check-label" for="hMusic">Music</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="country" class="form-label fw-semibold">Country</label>
                    <select class="form-select" id="country" required>
                        <option selected disabled value="">Choose</option>
                        <option value="KZ">Kazakhstan</option>
                        <option value="US">US</option>
                        <option value="GB">Great Britain</option>
                    </select>
                    <div class="invalid-feedback">Choose</div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary flex-grow-1" type="submit">Register</button>
                    <button class="btn btn-outline-secondary" type="reset">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    const pass = document.getElementById('rPass')
                    const confirm = document.getElementById('rPassConfirm')

                    if (pass.value !== confirm.value) {
                        confirm.setCustomValidity('Passwords are not the same')
                    } else {
                        confirm.setCustomValidity('')
                    }

                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
